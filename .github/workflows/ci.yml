name: CI

# Runs the always-on gate the repo previously lacked: the deterministic
# guardrail + RBAC assertion suites, then the Next.js build (type-check).
# Fast, hermetic (no DB / browser / network), so every push and PR is gated.
# Browser E2E and DB-integration tests are a follow-up (they need a Postgres
# service + provisioned auth — tracked as BL-05 / issues #142, #145).

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # Fast deterministic assertions first, so logic regressions fail early.
      - name: Guardrail self-check
        run: npm run test:selfcheck

      - name: RBAC model tests
        run: npm run test:rbac

      - name: Engine regression tests
        run: npm run test:engines

      - name: UI contract tests (self-hosted fonts, non-blocking tour)
        run: npm run test:ui

      - name: Robustness tests (timeouts, input validation, honest errors)
        run: npm run test:robustness

      - name: Tenant isolation tests (central auth/tenant guard)
        run: npm run test:tenant

      - name: Dashboard personalization tests
        run: npm run test:dashboard

      - name: Identity tests (least-privilege registration / no shipped creds)
        run: npm run test:identity

      - name: Telemetry labeling tests (truthful live-vs-demo provenance)
        run: npm run test:telemetry

      - name: Live tool-call ledger tests (audit-chain -> ledger)
        run: npm run test:enforcelive

      - name: Live egress tests (audit-chain -> egress surface)
        run: npm run test:egresslive

      - name: Live memory tests (audit-chain -> memory surface)
        run: npm run test:memorylive

      - name: Live runtime tests (audit-chain -> runtime surface)
        run: npm run test:runtimelive

      - name: Live circuit-breaker tests (audit-chain -> breaker surface)
        run: npm run test:breakerlive

      - name: Live retrieval tests (audit-chain -> retrieval surface)
        run: npm run test:retrievallive

      - name: Evidence Fabric tests (canonical core — chain, human-wins, adapters)
        run: npm run test:fabric

      - name: Discover ingestion tests (tier gate, metadata-only, provenance)
        run: npm run test:ingest

      - name: Live FinOps tests (audit-chain -> real spend, per-agent attribution)
        run: npm run test:costlive

      - name: Assistant honesty tests (live-vs-simulated provenance, no false routing)
        run: npm run test:assistanthonesty

      - name: Workspace identity tests (live signed-in user vs demo persona)
        run: npm run test:wsidentity

      - name: AIMS task inbox tests (governance tasks derived from Fabric + audit)
        run: npm run test:wstasks

      - name: Plane entitlement tests (WS2 seam — resolver, grant path, isolation)
        run: npm run test:entitlements

      - name: Enforce connection tests (WS2 seam — secret store, SSRF guard, honest state)
        run: npm run test:enforceconn

      - name: Security baseline tests (rate limits, validation, secrets, deps, error leakage, uploads)
        run: npm run test:security

      # Type-check via the production build (no DATABASE_URL -> demo build, clean no-op DB push).
      - name: Build (type-check)
        run: npx next build
